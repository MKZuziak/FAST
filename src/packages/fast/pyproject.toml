[project]
name = "fast"
version = "0.1.0"
description = "Shared lab utilities for FAST — Frontier AI Security Training"
requires-python = ">=3.10"

# Deliberately does NOT declare torch. Colab ships a CUDA build of torch already;
# declaring it here risks pip swapping in a CPU wheel mid-install and breaking a lab.
dependencies = [
    "numpy>=1.26",
    "transformers>=4.44",
    "accelerate>=0.34",
    "huggingface-hub>=0.25",
    # Preinstalled on Colab; declared for CI and local runs (day2 harm-classifier).
    "pandas>=2.0",
    "pyarrow>=14",
    "scikit-learn>=1.3",
    "ipywidgets>=7",
    # day4 location-triangulation draws its maps; preinstalled on Colab, declared for CI.
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "jupytext>=1.16",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
    "pre-commit>=3.7",
    "ruff>=0.6",
    # CPU torch, so CI can execute model-based labs. Colab brings its own CUDA build —
    # this is why torch is a dev dependency and not a runtime one.
    "torch>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fast"]
