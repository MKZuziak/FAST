name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # A real .venv, not --system: the runner's /usr Python is externally managed and
      # refuses system installs. This also matches how the repo is developed (see CLAUDE.md).
      - name: Install
        # CPU torch: the runners have no GPU, and the CUDA wheel is ~2GB for nothing.
        run: >
          uv venv &&
          uv pip install -e "src/packages/fast[dev]"
          --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Notebooks are in sync with their sources
        run: .venv/bin/python tools/build_labs.py --check

      # Solutions must run clean (a lab whose checks disagree with its own reference answer
      # fails here, not in the room), and every lab.ipynb must fail on its stub (a check that
      # passes on the removed exercise bodies is testing nothing).
      - name: Notebooks — solutions pass, stubs fail their checks
        run: .venv/bin/python -u tools/run_notebooks.py

      # The Day 2 control-hackathon referee's scoring engine isn't a notebook, so run_notebooks
      # won't touch it. This runs it with the model layer stubbed (no API key, no network) so a
      # scoring regression fails here, not in the room.
      - name: Control-hackathon referee engine
        run: .venv/bin/python src/day2-control/control-hackathon/server/tools/test_engine.py
